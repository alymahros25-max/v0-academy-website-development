name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm start > /tmp/next-server.log 2>&1 &
      - run: pnpm dlx @lhci/cli@0.15.x autorun --collect.url=http://localhost:3000/ --collect.url=http://localhost:3000/saudi-arabia --collect.url=http://localhost:3000/united-arab-emirates --collect.url=http://localhost:3000/united-states --collect.numberOfRuns=1 --assert.assertions.categories:performance=warn --assert.assertions.metrics:cls=0.1 --assert.assertions.metrics:total-blocking-time=300000
